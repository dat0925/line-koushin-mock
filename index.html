<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>LINE更新依頼 受付フロー（モック）</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Yu Gothic UI","Meiryo",sans-serif;background:#EEF2F0;color:#14201C}
  .lock{width:min(92vw,372px);background:#fff;border:1px solid #D5DDD8;border-radius:8px;padding:26px 24px 22px;box-shadow:0 6px 24px rgba(20,95,58,.10);text-align:center}
  .pill{display:inline-block;font-size:10px;letter-spacing:.16em;color:#145F3A;border:1px solid #B7D9C5;border-radius:3px;padding:2px 8px;margin-bottom:12px}
  h1{font-size:15px;margin:0 0 4px;line-height:1.5;color:#145F3A}
  .sub{font-size:11.5px;color:#5C6B66;margin:0 0 18px;line-height:1.6}
  input{width:100%;font-family:inherit;font-size:24px;letter-spacing:.5em;text-align:center;padding:10px 8px;border:1px solid #C3CCD5;border-radius:5px;background:#fff;color:inherit}
  input:focus{outline:2px solid #145F3A;outline-offset:1px}
  button{width:100%;margin-top:12px;font-family:inherit;font-size:13px;font-weight:700;padding:10px;border:0;border-radius:5px;background:#145F3A;color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{min-height:18px;margin-top:11px;font-size:11.5px}
  .err{color:#C00000;font-weight:700}
  .note{margin-top:16px;padding-top:13px;border-top:1px solid #E6EAEE;font-size:10.5px;color:#83888E;line-height:1.65;text-align:left}
</style>
</head>
<body>
<form class="lock" id="lock" autocomplete="off">
  <span class="pill">SITE MEISTER</span>
  <h1>LINE更新依頼 受付フロー<br>動くモック</h1>
  <p class="sub">閲覧用のPINコードを入力してください。</p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="････" aria-label="PINコード" autofocus>
  <button id="go" type="submit">解除する</button>
  <div class="msg" id="msg"></div>
  <div class="note">社内限の検討用モックです。画面の会社名・連絡先などはすべて架空のサンプルで、実際の送信は行いません。<br>PINは社内で共有されたものを使用してください。</div>
</form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg'), go = document.getElementById('go');
async function unlock(pin){
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b(PAYLOAD.salt), iterations:PAYLOAD.iterations, hash:'SHA-256' },
    await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']),
    { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b(PAYLOAD.iv) }, key, b(PAYLOAD.ct));
  return new TextDecoder().decode(buf);
}
document.getElementById('lock').addEventListener('submit', async e => {
  e.preventDefault();
  const pin = document.getElementById('pin').value.trim(); if(!pin) return;
  go.disabled = true; msg.className = 'msg'; msg.textContent = '照合しています…';
  try{ const html = await unlock(pin); document.open(); document.write(html); document.close(); }
  catch(err){ msg.className = 'msg err'; msg.textContent = 'PINコードが違います。'; go.disabled = false; document.getElementById('pin').select(); }
});
})();
</script>
